name: otel_supabase
description: >-
  OpenTelemetry instrumentation for supabase_flutter by Dartastic.io. Adds
  standard OpenTelemetry observability to applications that use
  supabase_flutter.
version: 0.1.0
repository: https://github.com/dartastic/otel_supabase
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  dartastic_opentelemetry_api: '>=1.0.0-rc.4 <1.0.0-rc.5'
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  dartastic_opentelemetry: ^1.1.0-beta.17
  flutter_test:
    sdk: flutter
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0

